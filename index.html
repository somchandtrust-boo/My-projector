<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0,user-scalable=no">

<title>Mobile Projector</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#050505;
    color:white;
}

/* =========================
   MAIN APP
========================= */

.app{
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
    background:
        radial-gradient(circle at top,#18202d 0%,#050505 55%);
}

/* =========================
   HEADER
========================= */

.header{
    height:65px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    border-bottom:1px solid rgba(255,255,255,.12);
    background:rgba(5,5,5,.75);
    backdrop-filter:blur(12px);
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:20px;
    font-weight:bold;
}

.projector-icon{
    width:38px;
    height:28px;
    border:2px solid #fff;
    border-radius:6px;
    position:relative;
}

.projector-icon::after{
    content:"";
    position:absolute;
    right:-10px;
    top:7px;
    width:9px;
    height:12px;
    border:2px solid #fff;
    border-left:0;
    border-radius:0 5px 5px 0;
}

.status{
    font-size:12px;
    color:#7dffb2;
}

/* =========================
   PROJECTOR AREA
========================= */

.projector-area{
    flex:1;
    min-height:0;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    padding:15px;
}

.screen{
    width:min(92vw,1000px);
    height:min(68vh,650px);

    background:#000;

    border:1px solid rgba(255,255,255,.15);

    box-shadow:
        0 0 40px rgba(0,0,0,.9),
        inset 0 0 50px rgba(0,0,0,.7);

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    position:relative;
}

/* Image */

.projected-image{
    max-width:100%;
    max-height:100%;

    object-fit:contain;

    user-select:none;
    -webkit-user-drag:none;

    transition:
        transform .25s ease,
        filter .25s ease;
}

/* Empty screen */

.empty{
    text-align:center;
    color:#777;
    padding:20px;
}

.empty-icon{
    font-size:65px;
    margin-bottom:15px;
}

.empty h2{
    color:#ddd;
    margin-bottom:8px;
}

.empty p{
    font-size:14px;
}

/* =========================
   SCREEN EFFECT
========================= */

.scanlines{
    position:absolute;
    inset:0;
    pointer-events:none;

    background:
        repeating-linear-gradient(
            to bottom,
            rgba(255,255,255,.025) 0px,
            rgba(255,255,255,.025) 1px,
            transparent 1px,
            transparent 4px
        );

    opacity:.25;
}

/* =========================
   CONTROLS
========================= */

.controls{
    flex-shrink:0;

    padding:12px 15px 16px;

    background:
        linear-gradient(
            to top,
            rgba(5,5,5,.98),
            rgba(10,10,10,.9)
        );

    border-top:1px solid rgba(255,255,255,.12);

    backdrop-filter:blur(15px);
}

.buttons{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
}

button{
    border:1px solid rgba(255,255,255,.16);

    background:
        linear-gradient(
            145deg,
            #202832,
            #0e1217
        );

    color:white;

    padding:11px 15px;

    border-radius:10px;

    font-size:14px;

    cursor:pointer;

    transition:.2s;

    min-width:85px;
}

button:hover{
    background:#293442;
    transform:translateY(-1px);
}

button:active{
    transform:scale(.96);
}

.primary{
    background:
        linear-gradient(
            145deg,
            #1769ff,
            #0b3b99
        );

    border-color:#3983ff;
}

.flash{
    background:
        linear-gradient(
            145deg,
            #ffb300,
            #a95e00
        );

    border-color:#ffc94d;
}

.danger{
    background:
        linear-gradient(
            145deg,
            #b51d35,
            #5e0c19
        );
}

/* =========================
   SLIDERS
========================= */

.adjustments{
    max-width:850px;
    margin:12px auto 0;

    display:grid;
    grid-template-columns:
        repeat(3,1fr);

    gap:12px;
}

.control{
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.08);
    border-radius:10px;
    padding:8px 12px;
}

.control label{
    display:flex;
    justify-content:space-between;
    font-size:11px;
    color:#aaa;
    margin-bottom:5px;
}

input[type="range"]{
    width:100%;
    accent-color:#3f8cff;
}

/* =========================
   FILE INPUT
========================= */

#imageInput{
    display:none;
}

/* =========================
   FULLSCREEN MODE
========================= */

.fullscreen-mode .header,
.fullscreen-mode .controls{
    display:none;
}

.fullscreen-mode .projector-area{
    padding:0;
}

.fullscreen-mode .screen{
    width:100vw;
    height:100vh;
    border:0;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .header{
        height:55px;
        padding:0 12px;
    }

    .logo{
        font-size:17px;
    }

    .projector-icon{
        width:32px;
        height:23px;
    }

    .projector-area{
        padding:8px;
    }

    .screen{
        width:100%;
        height:58vh;
    }

    .controls{
        padding:8px;
    }

    button{
        min-width:70px;
        padding:9px 10px;
        font-size:12px;
    }

    .adjustments{
        gap:6px;
    }

    .control{
        padding:6px;
    }

    .empty-icon{
        font-size:45px;
    }
}
</style>
</head>

<body>

<div class="app" id="app">

    <!-- HEADER -->

    <header class="header">

        <div class="logo">

            <div class="projector-icon"></div>

            <span>Mobile Projector</span>

        </div>

        <div class="status" id="status">
            READY
        </div>

    </header>


    <!-- PROJECTOR -->

    <main class="projector-area">

        <div class="screen" id="screen">

            <div class="empty" id="empty">

                <div class="empty-icon">
                    📽️
                </div>

                <h2>Projector Ready</h2>

                <p>
                    Select an image to begin
                </p>

            </div>

            <img
                id="projectedImage"
                class="projected-image"
                style="display:none;"
                alt="Projected Image"
            >

            <div class="scanlines"></div>

        </div>

    </main>


    <!-- CONTROLS -->

    <section class="controls">

        <div class="buttons">

            <label
                for="imageInput"
                class="primary"
                style="
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    padding:11px 15px;
                    border-radius:10px;
                    cursor:pointer;
                    min-width:85px;
                    font-size:14px;
                "
            >
                🖼️ Image
            </label>

            <input
                type="file"
                id="imageInput"
                accept="image/*"
            >


            <button onclick="zoomIn()">
                🔍 Zoom +
            </button>

            <button onclick="zoomOut()">
                🔎 Zoom -
            </button>

            <button onclick="rotateImage()">
                🔄 Rotate
            </button>

            <button onclick="flipImage()">
                ↔️ Flip
            </button>

            <button
                class="flash"
                onclick="toggleFlash()"
                id="flashButton"
            >
                💡 Flash
            </button>

            <button onclick="toggleFullscreen()">
                ⛶ Fullscreen
            </button>

            <button
                class="danger"
                onclick="resetProjector()"
            >
                ✕ Reset
            </button>

        </div>


        <!-- ADJUSTMENTS -->

        <div class="adjustments">

            <div class="control">

                <label>
                    <span>Zoom</span>
                    <span id="zoomValue">100%</span>
                </label>

                <input
                    type="range"
                    id="zoomSlider"
                    min="50"
                    max="250"
                    value="100"
                >

            </div>


            <div class="control">

                <label>
                    <span>Brightness</span>
                    <span id="brightnessValue">100%</span>
                </label>

                <input
                    type="range"
                    id="brightnessSlider"
                    min="20"
                    max="200"
                    value="100"
                >

            </div>


            <div class="control">

                <label>
                    <span>Contrast</span>
                    <span id="contrastValue">100%</span>
                </label>

                <input
                    type="range"
                    id="contrastSlider"
                    min="20"
                    max="200"
                    value="100"
                >

            </div>

        </div>

    </section>

</div>


<script>

/* =========================================
   VARIABLES
========================================= */

const imageInput =
    document.getElementById("imageInput");

const image =
    document.getElementById("projectedImage");

const empty =
    document.getElementById("empty");

const app =
    document.getElementById("app");

const statusText =
    document.getElementById("status");

const zoomSlider =
    document.getElementById("zoomSlider");

const brightnessSlider =
    document.getElementById("brightnessSlider");

const contrastSlider =
    document.getElementById("contrastSlider");

const zoomValue =
    document.getElementById("zoomValue");

const brightnessValue =
    document.getElementById("brightnessValue");

const contrastValue =
    document.getElementById("contrastValue");

const flashButton =
    document.getElementById("flashButton");


let zoom = 100;

let rotation = 0;

let flipped = false;

let brightness = 100;

let contrast = 100;

let stream = null;


/* =========================================
   IMAGE UPLOAD
========================================= */

imageInput.addEventListener(
    "change",
    function(){

        const file = this.files[0];

        if(!file) return;

        if(!file.type.startsWith("image/")){
            alert("Please select an image.");
            return;
        }

        const reader =
            new FileReader();

        reader.onload =
            function(event){

                image.src =
                    event.target.result;

                image.style.display =
                    "block";

                empty.style.display =
                    "none";

                statusText.textContent =
                    "IMAGE READY";

                resetImageSettings();

            };

        reader.readAsDataURL(file);

    }
);


/* =========================================
   UPDATE IMAGE
========================================= */

function updateImage(){

    const scale =
        zoom / 100;

    const flip =
        flipped ? -1 : 1;

    image.style.transform =
        `scale(${scale * flip})
         rotate(${rotation}deg)`;

    image.style.filter =
        `brightness(${brightness}%)
         contrast(${contrast}%)`;

    zoomValue.textContent =
        zoom + "%";

    brightnessValue.textContent =
        brightness + "%";

    contrastValue.textContent =
        contrast + "%";
}


/* =========================================
   ZOOM
========================================= */

function zoomIn(){

    zoom += 10;

    if(zoom > 250)
        zoom = 250;

    zoomSlider.value =
        zoom;

    updateImage();
}


function zoomOut(){

    zoom -= 10;

    if(zoom < 50)
        zoom = 50;

    zoomSlider.value =
        zoom;

    updateImage();
}


/* =========================================
   ROTATE
========================================= */

function rotateImage(){

    rotation += 90;

    if(rotation >= 360)
        rotation = 0;

    updateImage();
}


/* =========================================
   FLIP
========================================= */

function flipImage(){

    flipped =
        !flipped;

    updateImage();
}


/* =========================================
   SLIDERS
========================================= */

zoomSlider.addEventListener(
    "input",
    function(){

        zoom =
            Number(this.value);

        updateImage();

    }
);


brightnessSlider.addEventListener(
    "input",
    function(){

        brightness =
            Number(this.value);

        updateImage();

    }
);


contrastSlider.addEventListener(
    "input",
    function(){

        contrast =
            Number(this.value);

        updateImage();

    }
);


/* =========================================
   RESET
========================================= */

function resetImageSettings(){

    zoom = 100;

    rotation = 0;

    flipped = false;

    brightness = 100;

    contrast = 100;

    zoomSlider.value = 100;

    brightnessSlider.value = 100;

    contrastSlider.value = 100;

    updateImage();
}


function resetProjector(){

    image.src = "";

    image.style.display =
        "none";

    empty.style.display =
        "block";

    imageInput.value =
        "";

    resetImageSettings();

    statusText.textContent =
        "READY";
}


/* =========================================
   FULLSCREEN
========================================= */

async function toggleFullscreen(){

    try{

        if(!document.fullscreenElement){

            await app.requestFullscreen();

            app.classList.add(
                "fullscreen-mode"
            );

        }else{

            await document.exitFullscreen();

            app.classList.remove(
                "fullscreen-mode"
            );

        }

    }catch(error){

        console.log(
            "Fullscreen error:",
            error
        );

    }
}


document.addEventListener(
    "fullscreenchange",
    function(){

        if(!document.fullscreenElement){

            app.classList.remove(
                "fullscreen-mode"
            );

        }

    }
);


/* =========================================
   MOBILE FLASHLIGHT
========================================= */

async function toggleFlash(){

    try{

        /*
         * Camera torch access works only on
         * supported browsers/devices.
         */

        if(stream){

            const tracks =
                stream.getVideoTracks();

            tracks.forEach(
                track => track.stop()
            );

            stream = null;

            flashButton.textContent =
                "💡 Flash";

            statusText.textContent =
                "READY";

            return;
        }


        stream =
            await navigator.mediaDevices
                .getUserMedia({
                    video:{
                        facingMode:"environment"
                    }
                });


        const track =
            stream.getVideoTracks()[0];

        const capabilities =
            track.getCapabilities();

        if(capabilities.torch){

            await track.applyConstraints({
                advanced:[
                    {
                        torch:true
                    }
                ]
            });

            flashButton.textContent =
                "🔦 Flash ON";

            statusText.textContent =
                "FLASH ON";

        }else{

            alert(
                "Your browser/device does not support flashlight control."
            );

            track.stop();

            stream = null;

        }

    }catch(error){

        console.log(
            "Flashlight error:",
            error
        );

        alert(
            "Flashlight access was blocked. Allow camera permission and try again."
        );

    }

}


/* =========================================
   INITIALIZE
========================================= */

updateImage();

</script>

</body>
</html>
